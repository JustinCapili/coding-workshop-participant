spring.main.banner-mode=off

# Omit null fields, so an unassigned engineer has no "facultyAdminId": null in its JSON
spring.jackson.default-property-inclusion=non_null

# Make an unmatched path raise an exception the advice turns into a clean 404, rather than falling
# through to the static resource handler. Matters while checking whether a path prefix matched.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Run schema.sql against a real database rather than only an embedded one. The default, `embedded`,
# only runs it for in-memory databases such as H2, so without this the script never executes.
spring.sql.init.mode=always

# A Lambda instance serves one request at a time, so Hikari's default of 10 connections is 10 TLS
# handshakes at cold start and 10 Aurora connections per instance for nothing. Two covers the rare
# overlap (e.g. the pool's own validation) without that cost.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1

logging.level.root=INFO
logging.level.com.example=DEBUG
