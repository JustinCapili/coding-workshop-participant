# Local development only. Activated by:
#     mvn spring-boot:run -Dspring-boot.run.profiles=local
#
# Nothing here reaches the deployed function: the `local` profile is never active on Lambda.

# ServerlessAutoConfiguration contributes a ServletWebServerFactory that stands in for a web server
# without ever opening a port — exactly right inside Lambda, and useless when the point is to curl
# something. Excluding it lets Tomcat's factory take over and bind a real port.
spring.autoconfigure.exclude=org.springframework.cloud.function.serverless.web.ServerlessAutoConfiguration

# 3001 is the frontend's default VITE_API_URL, so `npm run dev` reaches this run with no env changes
# (LocalCorsConfig lets the browser call it directly). bin/proxy-server.js listens on 3001 too: use
# this or ./bin/start-dev.sh, not both at once.
server.port=3001

# The POSTGRES_* variables Terraform injects do not exist outside Lambda, so DataSourceConfig falls
# back to its defaults: localhost:5432, database `postgres`. With trust authentication configured on
# the local server the password is ignored, and schema.sql creates the tables on first start.

# Local runs are for seeing what the service does, so let it say so.
logging.level.org.springframework.web=INFO
