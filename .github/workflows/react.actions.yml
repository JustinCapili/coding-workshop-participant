name: Security Check - React

on: [pull_request, push]

jobs:
  npm:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      # security-events: write

    steps:
      - name: Setup GitHub Actions
        uses: actions/checkout@master

      - name: Setup Node.js
        uses: actions/setup-node@master
        with:
          node-version: '24'

      - name: Install npm dependencies
        run: npm install --prefix ./frontend

      - name: Run npm audit
        run: npm audit --prefix ./frontend --audit-level=high

      # Jest + React Testing Library, with the 80% coverage threshold. The Selenium suite
      # (npm run test:e2e) needs the LocalStack stack, so it runs locally, not here.
      - name: Run unit and component tests
        run: npm test --prefix ./frontend
